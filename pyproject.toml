[project]
name = "strategic-regime-monitor"
version = "0.0.1"
description = "Evidence-driven, bitemporal monitor of structural change and regime transitions"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "sdmx1>=2.26",
  "pyyaml>=6.0",
  "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
