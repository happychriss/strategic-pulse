python_access: sdmx1 source ESTAT, or the JSON-stat REST endpoint.
pitfalls:
- Only EA (changing composition) and EU27_2020 aggregates exist for the euro area; national series available.
- Use the default JSON-stat output. format=SDMX-CSV returns HTTP 400 on this endpoint. Requests above
  the size cap return HTTP 413.
- Many consumption bands and three tax levels; indicator definition must select band and tax level explicitly.
- 'Semi-annual, last period 2025-S2: lags the 2022 energy crisis by design.'
