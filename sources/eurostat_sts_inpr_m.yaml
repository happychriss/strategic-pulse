- Index base year changes between vintages (I95 to I21); compare vintages with growth rates RT1 and RT12,
  not index levels.
- 'NOT YET PULLED: ei_is_m_vtgfix (2001-2020). One request exceeds the size cap (HTTP 413 even for one
