id: eurostat_une_rt_m
provider: Eurostat
name: Unemployment rate, monthly
role: state_variable
phase: 1
endpoint:
  protocol: eurostat-rest-sdmx-2.1
  base_url: https://ec.europa.eu/eurostat/api/dissemination
  dataset_id: une_rt_m
  example_key: sdmx/2.1/data/une_rt_m
access:
  auth: none
  licence: CC BY 4.0 (Eurostat reuse policy)
  terms_url: https://ec.europa.eu/eurostat/about-us/policies/copyright
coverage:
  geography: EU, euro area, member states
  frequency: monthly
  start: '1983'
temporal:
  revision_policy: Revised with benchmarking and seasonal re-estimation; Eurostat publishes vintage tables
    for this indicator.
  vintage_support: full_history
  knowledge_time_basis: 'revdate dimension in the vintage tables: exact revision date. ei_lm_m_vtg covers
    2021-01-08 to 2026-08-25 (312 revdates); ei_lm_m_vtgfix covers 2001-05-15 to 2020-12-22 (1,319 revdates).
    Euro area is geo=EA in the vintage tables.'
python_access: sdmx1 source ESTAT, or the JSON-stat REST endpoint.
pitfalls:
- 'Euro area code differs per table: une_rt_m has EA21 only; namq_10_gdp and namq_10_lp_ulc have EA (changing
  composition), EA19, EA20, EA21; sts_inpr_m has EA19, EA20, EA21 and no EA.'
- Use the default JSON-stat output. format=SDMX-CSV returns HTTP 400 on this endpoint. Requests above
  the size cap return HTTP 413.
- Main table holds latest values only; use ei_lm_m_vtg and ei_lm_m_vtgfix for history of revisions.
verification:
  status: verified
  date: '2026-10-03'
  note: 'Pulled 2026-10-03: main series (EA21, 1983-01 to 2026-08) and both vintage tables for the euro
    area.'
docs_urls:
- https://ec.europa.eu/eurostat/web/main/data/web-services
- https://ec.europa.eu/eurostat/data/data-revision-policy
