id: ecb_icp
provider: ECB
name: HICP inflation, euro area (DISCONTINUED dataset, history to 2025-12)
role: state_variable
phase: 1
endpoint:
  protocol: sdmx-rest-2.1
  base_url: https://data-api.ecb.europa.eu/service/data
  dataset_id: ICP
  example_key: M.U2.N.000000.4.ANR
datasets:
- code: ECB:ICP
  parser: ecb_csv
  knowledge_rule: ingestion
  revision_class: revised
access:
  auth: none
  licence: ECB reuse policy (reuse with attribution)
  terms_url: https://www.ecb.europa.eu/services/disclaimer/html/index.en.html
coverage:
  geography: Euro area (U2) and member states
  frequency: monthly
  start: '1997'
temporal:
  revision_policy: Dataset discontinued by the ECB on 4 February 2026. Series ends 2025-12.
  vintage_support: none
  knowledge_time_basis: Ingestion timestamp. Flash vs final distinction is not exposed in the series;
    capture each pull as a snapshot.
python_access: sdmx1 source ECB.
pitfalls:
- Do not use for new work; use ecb_hicp. Kept only as the pre-2026 snapshot for comparison.
- 'Methodology change from February 2026 restated history in the replacement dataset: 25 headline months
  and 74 core months differ from this snapshot (largest headline gap 0.1 pp).'
- The ECB serves HTML error pages with HTTP 200 from this host at times; validate content before archiving.
verification:
  status: verified
  date: '2026-10-03'
  note: 'Pulled 2026-10-03: headline and core to 2025-12. Discontinuity note read in OBS_COM.'
docs_urls:
- https://data.ecb.europa.eu/data/datasets/ICP
superseded_by: ecb_hicp
