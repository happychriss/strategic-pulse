id: ecb_rtd
provider: ECB
name: Euro Area Real-Time Database (vintages of euro area macro series)
role: state_variable
phase: 1
endpoint:
  protocol: sdmx-rest-2.1
  base_url: https://data-api.ecb.europa.eu/service/data
  dataset_id: RTD
  example_key: 'M.S0.N.P_C_OV.A?includeHistory=true&format=csvdata (5 key positions: FREQ.REF_AREA.ADJUSTMENT.RT_ECON_CONCEPT.RT_DENOM)'
datasets:
- code: ECB:RTD
  parser: ecb_csv
  knowledge_rule: source_vintage_log
  revision_class: revised
access:
  auth: none
  licence: ECB reuse policy (reuse with attribution)
  terms_url: https://www.ecb.europa.eu/services/disclaimer/html/index.en.html
coverage:
  geography: Euro area
  frequency: monthly, quarterly, annual
  start: 2001 (vintages from January 2001)
temporal:
  revision_policy: Each series change is stored with exact validity timestamps; ACTION is Insert, Update
    or Delete.
  vintage_support: full_history
  knowledge_time_basis: VALID_FROM and VALID_TO timestamps on each row returned with includeHistory=true
    (for example 2017-07-19T15:30+02:00). Exact to the minute, no need for release-date approximation.
python_access: sdmx1 source ECB, or plain HTTP CSV (format=csvdata).
pitfalls:
- Wildcard keys need exactly 5 positions; six dots returns HTTP 400.
- Quarterly wildcard (Q....) timed out with HTTP 504; request concrete keys instead.
- 'includeHistory returns a change log, not a vintage matrix: reconstruct a value as of date T from VALID_FROM
  <= T < VALID_TO and ignore ACTION=Delete rows after their VALID_TO.'
- 'Volume: HICP all vintages 0.66 MB, unemployment all vintages 21 MB. Pull series one at a time.'
- Catalog of 182 monthly series includes HICP, unemployment, industrial production, 10-year benchmark
  yield and producer prices; annual series cover government finance ratios.
- Experimental dataset per the ECB; series coverage changed over time.
verification:
  status: verified
  date: '2026-10-03'
  note: 'Pulled 2026-10-03: catalog, HICP and unemployment full history. Vintage timestamps confirmed.'
docs_urls:
- https://data.ecb.europa.eu/data/datasets/RTD/data-information
- https://eabcn.org/data/eabcn-real-time-database
